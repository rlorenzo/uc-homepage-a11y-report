name: Test - Merced headed-fallback scan

# TEMPORARY, non-production check for the fix/scan-headed-fallback branch:
# does the headed-Chrome fallback clear Akamai for ucmerced.edu when the scan
# runs from a GitHub Actions (Azure datacenter) IP? Unlike monthly-scan.yml
# this checks out the current branch (so it runs the NEW scanner), scans only
# UC Merced, and commits / deploys NOTHING. Delete before merging to main.
on:
  push:
    branches: [fix/scan-headed-fallback]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-merced:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # chromium = headless fleet; chrome = real Google Chrome for the headed
      # fallback. Matches monthly-scan.yml.
      - name: Install browsers
        run: npx playwright install --with-deps chromium chrome

      - name: Scan UC Merced only (no commit, no deploy)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scan/run.mjs --campus=ucmerced

      - name: Summarize UC Merced results
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = fs.readdirSync("data/runs").sort().pop();
            const files = fs.readdirSync(`data/runs/${dir}`).filter((f) => f.startsWith("ucmerced"));
            let ok = 0, err = 0;
            for (const f of files) {
              const j = JSON.parse(fs.readFileSync(`data/runs/${dir}/${f}`));
              if (j.status === "error") { err++; console.log(`FAIL ${j.site}: ${j.error}`); }
              else { ok++; console.log(`OK   ${j.site} (render=${j.render_mode})`); }
            }
            console.log(`\n${ok} ok, ${err} error (of ${files.length})`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merced-scan-results
          path: data/runs/*/ucmerced*.json
          if-no-files-found: warn
