name: Deploy Site

# Deploys the Pages site when UI-only changes land on main.
# Scan data is not regenerated here — the monthly-scan workflow owns that
# and deploys its own results. Paths are filtered so a data-only commit
# from the monthly scan does NOT trigger a redundant redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize with the monthly-scan deploy so the two workflows never race
# each other to github-pages.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Pages artifact
        run: |
          # site/data is a symlink to ../data for local dev; replace with
          # a clean directory that only contains history.json so we don't
          # ship the per-run archives to Pages.
          rm -rf site/data
          mkdir -p site/data
          cp data/history.json site/data/history.json

      - name: Minify CSS
        run: npm run minify:css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
