name: Monthly Accessibility Scan

on:
  schedule:
    # Run at 14:00 UTC on the 1st of every month.
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility scan
        run: node scan/run.mjs

      - name: Commit results
        run: |
          git config user.name "a11y-bot"
          git config user.email "[email protected]"
          git add data/
          MONTH=$(date -u +"%Y-%m")
          git diff --quiet --cached || git commit -m "Monthly scan ${MONTH}"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p site/data
          cp data/history.json site/data/history.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
