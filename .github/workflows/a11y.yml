name: A11y

# Verifies the generated report site (site/) is accessible by serving it
# locally and running pa11y-ci against the rendered DOM with both axe-core
# and HTML_CodeSniffer rule sets at WCAG 2.0/2.1 A & AA.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Skip puppeteer's postinstall Chrome download. On the runner it leaves a
      # partial cache (folder present, executable missing) that pa11y can't
      # launch; we use the runner's preinstalled Chrome instead.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # ubuntu-latest ships Google Chrome stable. Point puppeteer at it so the
      # scan is deterministic and independent of puppeteer's managed download.
      - name: Run pa11y-ci against rendered site
        run: |
          google-chrome --version
          npm run a11y
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
