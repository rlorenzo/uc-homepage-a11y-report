name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome check (lint + format, JS and CSS)
        run: npx biome check

      - name: Fallow audit (dead code, duplication, complexity — new issues only)
        # GitHub's PR checkout doesn't set an upstream ref, so fallow can't
        # auto-detect the base. Pass it explicitly: PR base for pull_request
        # events, main for direct pushes.
        run: npx fallow audit --base "origin/${{ github.base_ref || 'main' }}"
