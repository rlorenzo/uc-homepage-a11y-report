name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Biome check (lint + format, JS and CSS)
        run: npx biome check

      - name: Fallow audit (dead code, duplication, complexity — new issues only)
        # PR-only: audit compares HEAD against the PR base. On push to main,
        # origin/main resolves to the just-pushed HEAD after checkout, so the
        # diff would be empty and the audit would catch nothing — the PR
        # gate already covered the changeset.
        if: github.event_name == 'pull_request'
        run: npx fallow audit --base "origin/${{ github.base_ref }}"
